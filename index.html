<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir Ayam Goreng Bawang Putih</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-2 md:p-4">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [menu, setMenu] = useState(() => JSON.parse(localStorage.getItem('menu')) || [
        { id: 1, name: 'Dada', price: 15000, stock: 50 },
        { id: 2, name: 'Paha Atas', price: 15000, stock: 50 },
        { id: 3, name: 'Paha Bawah', price: 12000, stock: 50 },
        { id: 4, name: 'Sayap', price: 10000, stock: 50 },
        { id: 5, name: 'Nasi Putih', price: 5000, stock: 50 },
        { id: 6, name: 'Nasi Daun Jeruk', price: 7000, stock: 50 }
      ]);
      const [sales, setSales] = useState(() => JSON.parse(localStorage.getItem('sales')) || []);
      const [cart, setCart] = useState([]);
      const [tab, setTab] = useState('kasir');

      // State untuk Filter Laporan
      const [filterMonth, setFilterMonth] = useState(new Date().getMonth());
      const [filterYear, setFilterYear] = useState(new Date().getFullYear());

      useEffect(() => { localStorage.setItem('menu', JSON.stringify(menu)); }, [menu]);
      useEffect(() => { localStorage.setItem('sales', JSON.stringify(sales)); }, [sales]);

      const addToCart = (item) => {
        if (item.stock <= 0) return alert('Stok habis!');
        const existing = cart.find(c => c.id === item.id);
        if (existing) {
          setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
        } else {
          setCart([...cart, { ...item, qty: 1 }]);
        }
        setMenu(menu.map(m => m.id === item.id ? { ...m, stock: m.stock - 1 } : m));
      };

      const hapusDariKeranjang = (itemCart) => {
        // Kembalikan stok
        setMenu(menu.map(m => m.id === itemCart.id ? { ...m, stock: m.stock + itemCart.qty } : m));
        // Hapus dari keranjang
        setCart(cart.filter(c => c.id !== itemCart.id));
      };

      const checkout = () => {
        if (cart.length === 0) return;
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        setSales([...sales, { date: new Date().toISOString(), items: cart, total }]);
        setCart([]);
        alert('Pembayaran berhasil tersimpan!');
      };

      // FUNGSI BARU: Hapus Transaksi (Void)
      const deleteTransaction = (txToDel) => {
        const confirmDelete = window.confirm("Batalkan transaksi ini? Omset akan berkurang dan stok akan dikembalikan otomatis.");
        if (!confirmDelete) return;

        let updatedMenu = [...menu];
        txToDel.items.forEach(cartItem => {
          const idx = updatedMenu.findIndex(m => m.id === cartItem.id);
          if (idx !== -1) {
            updatedMenu[idx].stock += cartItem.qty;
          }
        });
        setMenu(updatedMenu);
        setSales(sales.filter(tx => tx.date !== txToDel.date));
      };

      const addMenu = (e) => {
        e.preventDefault();
        const form = e.target;
        const newItem = {
          id: Date.now(),
          name: form.name.value,
          price: parseInt(form.price.value),
          stock: parseInt(form.stock.value)
        };
        setMenu([...menu, newItem]);
        form.reset();
      };

      const updateMenu = (id, field, value) => {
        setMenu(menu.map(m => {
          if (m.id === id) {
            return { ...m, [field]: field === 'name' ? value : (parseInt(value) || 0) };
          }
          return m;
        }));
      };

      const deleteMenu = (id) => {
        if (window.confirm("Yakin ingin menghapus menu ini dari daftar?")) {
          setMenu(menu.filter(m => m.id !== id));
        }
      };

      // Perhitungan Laporan
      const todayStr = new Date().toLocaleDateString('id-ID');
      let totalHarian = 0;
      let totalBulananPilihan = 0;
      let totalTahunanPilihan = 0;
      let totalSemua = 0;

      const filteredSales = sales.filter(tx => {
        const txDate = new Date(tx.date);
        return txDate.getMonth() === parseInt(filterMonth) && txDate.getFullYear() === parseInt(filterYear);
      });

      sales.forEach(tx => {
        const txDate = new Date(tx.date);
        const txTotal = tx.total;
        totalSemua += txTotal;
        
        if (txDate.toLocaleDateString('id-ID') === todayStr) {
          totalHarian += txTotal;
        }
        if (txDate.getMonth() === parseInt(filterMonth) && txDate.getFullYear() === parseInt(filterYear)) {
          totalBulananPilihan += txTotal;
        }
        if (txDate.getFullYear() === parseInt(filterYear)) {
          totalTahunanPilihan += txTotal;
        }
      });

      return (
        <div className="max-w-md mx-auto bg-white p-4 rounded-xl shadow-lg min-h-screen pb-20">
          <div className="flex justify-between mb-4 border-b pb-3">
            <button onClick={() => setTab('kasir')} className={`font-bold ${tab === 'kasir' ? 'text-orange-600 border-b-2 border-orange-600' : 'text-gray-400'}`}>🛒 Kasir</button>
            <button onClick={() => setTab('stok')} className={`font-bold ${tab === 'stok' ? 'text-orange-600 border-b-2 border-orange-600' : 'text-gray-400'}`}>📦 Stok</button>
            <button onClick={() => setTab('laporan')} className={`font-bold ${tab === 'laporan' ? 'text-orange-600 border-b-2 border-orange-600' : 'text-gray-400'}`}>📊 Laporan</button>
          </div>

          {tab === 'kasir' && (
            <div>
              <div className="grid grid-cols-2 gap-3 mb-6">
                {menu.map(item => (
                  <button key={item.id} onClick={() => addToCart(item)} className="p-3 border rounded-lg bg-orange-50 active:bg-orange-100 flex flex-col items-start shadow-sm">
                    <span className="font-bold text-gray-800 text-left">{item.name}</span>
                    <span className="text-orange-600 font-semibold">Rp{item.price.toLocaleString('id-ID')}</span>
                    <span className="text-xs text-gray-500 mt-1">Sisa Stok: {item.stock}</span>
                  </button>
                ))}
              </div>
              <div className="border-t pt-4">
                <h3 className="font-bold mb-3">Pesanan Saat Ini</h3>
                {cart.map((c, i) => (
                  <div key={i} className="flex justify-between items-center text-sm mb-2 pb-2 border-b border-gray-100">
                    <div>
                      <span>{c.name} (x{c.qty})</span>
                      <div className="font-semibold">Rp{(c.price * c.qty).toLocaleString('id-ID')}</div>
                    </div>
                    <button onClick={() => hapusDariKeranjang(c)} className="bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold">Batal</button>
                  </div>
                ))}
                <div className="flex justify-between font-bold text-lg mt-3">
                  <span>Total:</span>
                  <span className="text-orange-600">Rp{cart.reduce((s, c) => s + (c.price * c.qty), 0).toLocaleString('id-ID')}</span>
                </div>
                <button onClick={checkout} className="w-full mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg shadow">PROSES PEMBAYARAN</button>
              </div>
            </div>
          )}

          {tab === 'stok' && (
            <div>
              <form onSubmit={addMenu} className="mb-8 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 className="font-bold mb-3 text-gray-700">Tambah Menu / Tipe Baru</h3>
                <input name="name" placeholder="Nama Barang" required className="w-full mb-3 p-2 border rounded" />
                <div className="flex gap-3 mb-3">
                  <input name="price" type="number" placeholder="Harga Jual" required className="w-1/2 p-2 border rounded" />
                  <input name="stock" type="number" placeholder="Stok Awal" required className="w-1/2 p-2 border rounded" />
                </div>
                <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold p-2 rounded">Tambahkan</button>
              </form>
              <h3 className="font-bold mb-3 text-gray-700">Edit / Hapus Daftar Menu</h3>
              <div className="space-y-3">
                {menu.map(item => (
                  <div key={item.id} className="flex items-center gap-2 p-2 bg-gray-50 rounded border">
                    <div className="w-2/5 flex flex-col">
                      <span className="text-[10px] text-gray-500">Nama</span>
                      <input type="text" value={item.name} onChange={e => updateMenu(item.id, 'name', e.target.value)} className="w-full p-1 border rounded text-sm font-semibold" />
                    </div>
                    <div className="w-1/4 flex flex-col">
                      <span className="text-[10px] text-gray-500">Harga</span>
                      <input type="number" value={item.price} onChange={e => updateMenu(item.id, 'price', e.target.value)} className="w-full p-1 border rounded text-sm" />
                    </div>
                    <div className="w-1/4 flex flex-col">
                      <span className="text-[10px] text-gray-500">Stok</span>
                      <input type="number" value={item.stock} onChange={e => updateMenu(item.id, 'stock', e.target.value)} className="w-full p-1 border rounded text-sm" />
                    </div>
                    <button onClick={() => deleteMenu(item.id)} className="w-[10%] text-red-500 font-bold text-lg hover:text-red-700">×</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'laporan' && (
            <div>
              <div className="flex gap-2 mb-4 bg-gray-50 p-2 rounded-lg border">
                <select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} className="p-2 border rounded bg-white flex-1 text-sm font-bold text-gray-700">
                  <option value={0}>Januari</option>
                  <option value={1}>Februari</option>
                  <option value={2}>Maret</option>
                  <option value={3}>April</option>
                  <option value={4}>Mei</option>
                  <option value={5}>Juni</option>
                  <option value={6}>Juli</option>
                  <option value={7}>Agustus</option>
                  <option value={8}>September</option>
                  <option value={9}>Oktober</option>
                  <option value={10}>November</option>
                  <option value={11}>Desember</option>
                </select>
                <input type="number" value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="p-2 border rounded bg-white w-24 text-sm font-bold text-gray-700 text-center" />
              </div>

              <div className="grid grid-cols-2 gap-3 mb-6">
                <div className="bg-blue-100 p-3 rounded-lg text-center shadow-sm">
                  <h3 className="text-xs font-bold text-gray-700">Omset Hari Ini</h3>
                  <div className="text-lg font-bold text-blue-700">Rp{totalHarian.toLocaleString('id-ID')}</div>
                </div>
                <div className="bg-green-100 p-3 rounded-lg text-center shadow-sm">
                  <h3 className="text-xs font-bold text-gray-700">Omset Bulan Dipilih</h3>
                  <div className="text-lg font-bold text-green-700">Rp{totalBulananPilihan.toLocaleString('id-ID')}</div>
                </div>
                <div className="bg-purple-100 p-3 rounded-lg text-center shadow-sm">
                  <h3 className="text-xs font-bold text-gray-700">Omset Tahun Dipilih</h3>
                  <div className="text-lg font-bold text-purple-700">Rp{totalTahunanPilihan.toLocaleString('id-ID')}</div>
                </div>
                <div className="bg-orange-100 p-3 rounded-lg text-center shadow-sm">
                  <h3 className="text-xs font-bold text-gray-700">Total Semua Sejak Awal</h3>
                  <div className="text-lg font-bold text-orange-700">Rp{totalSemua.toLocaleString('id-ID')}</div>
                </div>
              </div>

              <h3 className="font-bold mb-3 text-gray-700">Riwayat Penjualan ({filteredSales.length} trx)</h3>
              <div className="space-y-3">
                {filteredSales.length === 0 ? (
                  <p className="text-sm text-gray-500 italic text-center py-4">Belum ada transaksi di bulan ini.</p>
                ) : (
                  filteredSales.slice().reverse().map((tx, i) => (
                    <div key={i} className="bg-white p-3 border rounded-lg shadow-sm">
                      <div className="flex justify-between items-start mb-2">
                        <div className="text-xs text-gray-500">{new Date(tx.date).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}</div>
                        <button onClick={() => deleteTransaction(tx)} className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded font-bold hover:bg-red-200">Batalkan Transaksi</button>
                      </div>
                      {tx.items.map((item, j) => (
                        <div key={j} className="flex justify-between text-sm text-gray-700">
                          <span>{item.name} x{item.qty}</span>
                          <span>Rp{(item.price * item.qty).toLocaleString('id-ID')}</span>
                        </div>
                      ))}
                      <div className="flex justify-between font-bold text-sm mt-2 pt-2 border-t">
                        <span>Total Transaksi</span>
                        <span>Rp{tx.total.toLocaleString('id-ID')}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
